services:
  auditor:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      APP_DATA_DIR: /srv/app/data
    volumes:
      - auditor_data:/srv/app/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  auditor_data:
